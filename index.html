<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مركز أصحاب الكساء</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Noto+Kufi+Arabic:wght@700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --gold: #d4a017;
            --light-gold: #f5d060;
            --dark-gold: #8a6520;
            --bg-black: #050505;
            --bg-light: #f8f9fa;
            --accent-green: #00897b;
            --premium-black: #111111;
            --gold-gradient: linear-gradient(135deg, #d4a017 0%, #8a6520 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Poppins', 'Amiri', serif;
            color: #333;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 414px;
            height: 896px;
            background: #fff;
            position: relative;
            overflow: hidden;
            border-radius: 45px;
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.5);
            border: 8px solid #333;
        }

        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 30px;
            background: #333;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            z-index: 500;
        }

        .screen {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            z-index: 100;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .screen.active {
            display: flex;
        }

        /* --- 1. WELCOME SCREEN --- */
        #welcome-screen {
            background: radial-gradient(circle at center, #1a1500 0%, #000 100%);
            padding: 40px 20px;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
        }

        .dome-container {
            position: relative;
            width: 240px;
            height: 240px;
            margin-bottom: 30px;
        }

        .dome-frame {
            width: 100%;
            height: 100%;
            padding: 6px;
            border-radius: 50%;
            background: var(--gold-gradient);
            box-shadow: 0 0 50px rgba(212, 160, 23, 0.4);
            animation: pulseGlow 4s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); box-shadow: 0 0 30px rgba(212, 160, 23, 0.3); }
            100% { transform: scale(1.02); box-shadow: 0 0 60px rgba(212, 160, 23, 0.6); }
        }

        .hero-gif {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #000;
            /* Smooth GIF loop effect */
            mask-image: radial-gradient(circle, black 60%, transparent 100%);
            -webkit-mask-image: radial-gradient(circle, black 60%, transparent 100%);
        }

        .kufic-text {
            font-family: 'Noto Kufi Arabic', sans-serif;
            font-size: 16px; /* Slightly smaller as requested */
            color: var(--gold);
            margin-bottom: 40px;
            white-space: nowrap; /* Single line */
            text-shadow: 0 0 15px rgba(212, 160, 23, 0.4);
            letter-spacing: 0.5px;
        }

        .flag-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 85%;
            animation: fadeInUp 1s ease;
        }

        .flag-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .flag-item:hover { transform: translateY(-5px); }

        .flag-img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--gold);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .flag-item span {
            font-size: 13px;
            color: #ddd;
            font-family: 'Noto Nastaliq Urdu', serif;
        }

        /* --- 2. DASHBOARD SCREEN --- */
        #dashboard {
            background: var(--bg-light);
        }

        .dash-header {
            padding: 50px 20px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
        }

        .prayer-info {
            font-size: 14px;
            font-weight: 600;
        }

        .prayer-info span { color: #888; font-size: 11px; display: block; }

        .header-icons { display: flex; gap: 15px; font-size: 22px; color: #444; }

        .hero-banner-full {
            width: 100%;
            height: 220px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .hero-banner-full img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Full width left to right */
        }

        .ai-assistant-bar {
            margin: 15px 20px;
            background: #fff;
            border-radius: 15px;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #eee;
        }

        .ai-title { display: flex; align-items: center; gap: 10px; color: var(--accent-green); font-weight: 600; font-size: 14px; }
        .ai-status { background: #e0f2f1; color: var(--accent-green); font-size: 11px; padding: 4px 12px; border-radius: 20px; }

        .app-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 0 20px;
            margin-bottom: 25px;
        }

        .premium-card {
            background: #fff;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-decoration: none;
            color: #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid #f0f0f0;
            transition: all 0.3s;
        }

        .premium-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold);
            box-shadow: 0 10px 25px rgba(212, 160, 23, 0.1);
        }

        .card-top { display: flex; justify-content: space-between; align-items: center; }
        .card-name { font-weight: 700; font-size: 15px; font-family: 'Poppins', sans-serif; }
        .card-icon-img { width: 45px; height: 45px; object-fit: contain; }

        .wide-feature {
            grid-column: span 2;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
        }

        .scrollable-section {
            padding: 0 20px 100px;
        }

        .section-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .section-title-row h3 { font-size: 17px; font-weight: 700; }
        .btn-more { font-size: 12px; color: #888; text-decoration: none; }

        .slider-box {
            width: 100%;
            height: 160px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .slider-box img { width: 100%; height: 100%; object-fit: cover; }

        .bottom-nav-premium {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 85px;
            background: #fff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #eee;
            padding-bottom: 15px;
            z-index: 400;
        }

        .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: #bbb;
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
        }

        .nav-link.active { color: var(--accent-green); }
        .nav-link i { font-size: 26px; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

<body>
    <div class="app-container">
        <div class="notch"></div>

        <!-- 1. WELCOME SCREEN -->
        <div id="welcome-screen" class="screen active">
            <div class="dome-container">
                <div class="dome-frame">
                    <img src="https://res.cloudinary.com/dluuenj8g/image/upload/v1779792165/Untitled_design_e3k0wj.gif" class="hero-gif">
                </div>
            </div>
            
            <div class="kufic-text">السلام علیک یا اباعبداللہ الحسینؑ</div>
            
            <div class="flag-list">
                <div class="flag-item" onclick="enterApp('ur')">
                    <img src="https://res.cloudinary.com/dtqrziupt/image/upload/v1776121608/pak-flag_sj8vdp.webp" class="flag-img">
                    <span>اردو</span>
                </div>
                <div class="flag-item" onclick="enterApp('fa')">
                    <img src="https://res.cloudinary.com/dtqrziupt/image/upload/v1776121608/iran-flag_jjfv2w.webp" class="flag-img">
                    <span>فارسی</span>
                </div>
                <div class="flag-item" onclick="enterApp('en')">
                    <img src="https://res.cloudinary.com/dtqrziupt/image/upload/v1776121608/england-flag_clc1jb.webp" class="flag-img">
                    <span>English</span>
                </div>
            </div>
        </div>

        <!-- 2. DASHBOARD SCREEN -->
        <div id="dashboard" class="screen">
            <div class="dash-header">
                <div class="prayer-info">
                    Dhuhr prayer 17:35
                    <span>-20:03:45</span>
                </div>
                <div class="header-icons">
                    <i class="ti ti-user-circle"></i>
                    <i class="ti ti-settings"></i>
                </div>
            </div>

            <div class="hero-banner-full">
                <img src="https://res.cloudinary.com/dluuenj8g/image/upload/v1779797084/%D9%85%D8%B1%D9%83%D8%B2_%D8%A3%D8%B5%D8%AD%D8%A7%D8%A8_%D8%A7%D9%84%DA%A9%D8%B3%D8%A7%D8%A1_33%D8%91_rry5vt.png" alt="Markaz Ashab al Kisa">
            </div>

            <div class="ai-assistant-bar">
                <div class="ai-title">
                    <i class="ti ti-sparkles"></i>
                    <span>AI Q&A <span style="color:#999; font-weight:400; margin-left:5px;">Your Islamic assistant</span></span>
                </div>
                <div class="ai-status">Coming soon</div>
            </div>

            <div class="app-grid">
                <a href="https://imamhussain.org/urdu/live" target="_blank" class="premium-card">
                    <div class="card-top">
                        <span class="card-name">Live Ziyarat</span>
                        <img src="https://cdn-icons-png.flaticon.com/512/2615/2615077.png" class="card-icon-img">
                    </div>
                </a>
                <a href="https://imamhussain.org/urdu/awrad" target="_blank" class="premium-card">
                    <div class="card-top">
                        <span class="card-name">Dua & Azkar</span>
                        <img src="https://cdn-icons-png.flaticon.com/512/2910/2910791.png" class="card-icon-img">
                    </div>
                </a>
                <a href="https://app.imamhussain.org/tours/?lang=ur" target="_blank" class="premium-card">
                    <div class="card-top">
                        <span class="card-name">Virtual Tour</span>
                        <img src="https://cdn-icons-png.flaticon.com/512/3251/3251145.png" class="card-icon-img">
                    </div>
                </a>
                <a href="https://imamhussain.org/urdu/message" target="_blank" class="premium-card">
                    <div class="card-top">
                        <span class="card-name">Niabat</span>
                        <img src="https://cdn-icons-png.flaticon.com/512/1828/1828884.png" class="card-icon-img">
                    </div>
                </a>
                <a href="https://imamhussain.org/urdu/live" target="_blank" class="premium-card wide-feature">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <img src="https://cdn-icons-png.flaticon.com/512/2972/2972143.png" class="card-icon-img">
                        <span class="card-name">Imam Hussain TV</span>
                    </div>
                    <i class="ti ti-player-play" style="color: var(--gold); font-size: 20px;"></i>
                </a>
            </div>

            <div class="scrollable-section">
                <div class="section-title-row">
                    <h3>Highlights</h3>
                    <a href="#" class="btn-more">See all ></a>
                </div>
                <div class="slider-box">
                    <img src="https://images.unsplash.com/photo-1590076175516-72439167c699?auto=format&fit=crop&q=80&w=500">
                </div>
            </div>

            <div class="bottom-nav-premium">
                <a href="#" class="nav-link active">
                    <i class="ti ti-smart-home"></i>
                    <span>Home</span>
                </a>
                <a href="https://imamhussain.org/urdu/live" target="_blank" class="nav-link">
                    <i class="ti ti-video"></i>
                    <span>Video</span>
                </a>
                <a href="https://imamhussain.org/urdu/awrad" target="_blank" class="nav-link">
                    <i class="ti ti-book-2"></i>
                    <span>Dua</span>
                </a>
                <a href="#" class="nav-link">
                    <i class="ti ti-settings"></i>
                    <span>Setting</span>
                </a>
            </div>
        </div>
    </div>

    <audio id="salamAudio" src="https://www.alkawthartv.ir/uploads/85/2021/Oct/03/6122557577_1633241042732.mp3"></audio>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        function enterApp(lang) {
            const welcome = document.getElementById('welcome-screen');
            const dashboard = document.getElementById('dashboard');
            
            welcome.style.opacity = '0';
            welcome.style.transform = 'translateY(-20px) scale(0.95)';
            
            setTimeout(() => {
                welcome.classList.remove('active');
                dashboard.classList.add('active');
                
                const audio = document.getElementById('salamAudio');
                audio.play().catch(e => console.log("Audio failed"));
            }, 600);
        }
    </script>
</body>
</html>
